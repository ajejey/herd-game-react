      - heading "Frequently asked questions" [level=2] [ref=e103]
      - generic [ref=e104]:
        - generic [ref=e105]:
          - heading "Is Taboo online free?" [level=3] [ref=e106]
          - paragraph [ref=e107]: Yes — completely free, no download and no signup. Create a room, share the code, and everyone plays in their browser on any device.
        - generic [ref=e108]:
          - heading "How do you play Taboo?" [level=3] [ref=e109]
          - paragraph [ref=e110]: One player describes a target word to their team, but cannot say any of the five forbidden words listed on the card. Every word the team guesses is a point. The opposing team watches and can buzz if a forbidden word slips out, which costs a point.
        - generic [ref=e111]:
          - heading "How many players do you need?" [level=3] [ref=e112]
          - paragraph [ref=e113]: Three is enough — with 3 you play co-op, sharing one score. With 4 or more you split into two teams and compete. It works well up to a big group.
        - generic [ref=e114]:
          - heading "Can you play Taboo on Zoom or Microsoft Teams?" [level=3] [ref=e115]
          - paragraph [ref=e116]: Yes. Everyone joins from their own device with the room code while you stay on the call, so it works on Zoom, Microsoft Teams, Google Meet or any video chat. Only the describer sees the card.
        - generic [ref=e117]:
          - heading "Do I need the physical Taboo cards?" [level=3] [ref=e118]
          - paragraph [ref=e119]: No. The cards are built in — the game deals a word and its forbidden words to whoever is describing, and only they can see it. No buzzer or timer needed either.
