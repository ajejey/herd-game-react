    - generic [ref=e55]:
      - heading "How to play the memory game" [level=2] [ref=e56]
      - paragraph [ref=e57]: Six pasture tiles light up one at a time. Watch the order, then tap them back exactly as they appeared. Each round adds one more tile, so round five is a five-tile sequence and round ten is ten. A single wrong tap ends the run, and your score is the number of rounds you got through.
      - paragraph [ref=e58]: Every tile has its own musical note, which makes long sequences much easier to hold on to — most people find they remember the tune before they remember the colours. There is no daily limit, so you can go again straight away, and your best score is saved on your device.
      - heading "Questions" [level=2] [ref=e59]
