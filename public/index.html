        <!-- Google tag (gtag.js)

         Loaded ONLY on the live domain. This file is served unchanged by the
         CRA dev server and by the Playwright harness, so without this guard
         every local run and every e2e sweep reported real pageviews into the
         production property — dozens of "Direct" sessions with ~0s engagement,
         which is indistinguishable from crawler traffic and was actively
         corrupting the numbers we make decisions on.

         gtag() is still defined as a no-op collector off-domain so that any
         caller elsewhere in the app cannot throw. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      if (location.hostname === 'herdgamesonline.com' || location.hostname === 'www.herdgamesonline.com') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CKSTFW8FPE';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-CKSTFW8FPE');
      }
    </script>
    <meta name="google-site-verification" content="7nItEeuNSAIFL_unU4Ai5p-SGizDDaJU8XRYEKdtOgk" />

         actually serves ads; Grow above only measures. Mediavine places ads

         Domain-guarded for the same reasons as Grow, and here the guard is not
         just tidiness: serving a web ad tag inside the Capacitor Android app's
         WebView (origin https://localhost) is against ad-network policy and

         Injected rather than pasted inline so it can sit behind that guard.
